      - name: Install Android platform
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Restore reference type chart
        run: python3 scripts/restore-type-chart.py
      - name: Check source, name and icons
        run: python3 scripts/check-source.py
      - name: Test offline core
        run: python3 scripts/run-core-tests.py
      - name: Build APK
        run: |
          sed -i '/android:windowLightNavigationBar/d' app/src/main/res/values/styles.xml
          gradle --no-daemon --console=plain :app:assembleRelease :app:lintRelease
      - name: Verify and collect APK
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          python3 scripts/check-apk.py "$apk"
          mkdir -p dist
          cp "$apk" dist/PokeRogue-Modern-Gecko-arm64.apk
          sha256sum dist/PokeRogue-Modern-Gecko-arm64.apk > dist/SHA256SUMS.txt
          stat --printf='APK bytes: %s\n' dist/PokeRogue-Modern-Gecko-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Modern-Gecko-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Make APK directly downloadable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="gecko-modern-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$tag" dist/PokeRogue-Modern-Gecko-arm64.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "PokeRogue Modern Gecko test build ${{ github.run_number }}" \
            --notes "ARM64 GeckoView personal build with the Modern launcher, settings, tools and optional offline downloads. Original PokeRogue Offline display name and icons retained. Separate package from the first Gecko test APK: existing app does not need to be removed. No game files are downloaded until requested. First online launch requires internet and your PokeRogue login. Actual phone UI and performance still need testing." \
            --prerelease

