      - name: Install Android platform
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Check source, name and icons
        run: python3 scripts/check-source.py
      - name: Build APK
        run: gradle --no-daemon --console=plain :app:assembleRelease :app:lintRelease
      - name: Verify and collect APK
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=app/build/outputs/apk/release/app-release.apk
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          python3 scripts/check-apk.py "$apk"
          mkdir -p dist
          cp "$apk" dist/PokeRogue-Online-Gecko-arm64.apk
          sha256sum dist/PokeRogue-Online-Gecko-arm64.apk > dist/SHA256SUMS.txt
          stat --printf='APK bytes: %s\n' dist/PokeRogue-Online-Gecko-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Online-Gecko-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Make APK directly downloadable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="gecko-online-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$tag" dist/PokeRogue-Online-Gecko-arm64.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "PokeRogue Gecko online test build ${{ github.run_number }}" \
            --notes "Online-only ARM64 GeckoView personal test build. Original PokeRogue Offline name and icons retained. Firefox installation is not needed. First launch requires internet access and your PokeRogue login. Runtime performance still needs testing on the phone." \
            --prerelease

